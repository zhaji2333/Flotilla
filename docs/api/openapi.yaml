openapi: 3.1.0
info:
  title: Flotilla Frontend API
  version: 1.0.0
  description: |
    Flotilla 控制面只读投影 + 人工动作 API（v1，契约冻结）。
    前端只通过本契约消费数据；独立 API 服务（packages/api）与旧 web API 暴露同一路径/schema。
    P3-A2 起 /api/metrics 返回指标目录（ADR-0019 后为 12 项）（indicators）；P3-A1 起新增 trace-summaries。
servers:
  - url: http://127.0.0.1:3001
    description: 独立 API 服务（packages/api）
  - url: http://127.0.0.1:5173
    description: 旧 Next API（过渡回退）
security:
  - bearerAuth: []
tags:
  - name: system
  - name: missions
  - name: findings
  - name: approvals
  - name: hints
  - name: triggers
  - name: traces
paths:
  /api/health:
    get:
      security: []
      tags: [system]
      operationId: getHealth
      summary: 健康检查与出站模式
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/login:
    post:
      security: []
      tags: [auth]
      operationId: login
      summary: 单管理员会话登录（ADR-0038）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: 登录成功；Set-Cookie src_agent_session
          content:
            application/json:
              schema:
                type: object
                required: [user, csrfToken]
                properties:
                  user:
                    type: object
                    additionalProperties: true
                  csrfToken: { type: string }
                  expiresAt: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/me:
    get:
      security: []
      tags: [auth]
      operationId: getSession
      summary: 当前会话（含 mustChangePassword / authMode）
      responses:
        '200':
          description: 会话信息
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      security: []
      tags: [auth]
      operationId: logout
      summary: 注销会话并清 cookie
      responses:
        '200':
          description: OK
  /api/auth/password:
    post:
      tags: [auth]
      operationId: changeOwnPassword
      summary: 修改自己的密码（≥12 位，含大小写/数字/特殊字符；成功后吊销旧会话）
      description: 首次登录未改密时，除 /api/health、/api/auth/{me,password,logout} 外全部 403 password_change_required。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        '200':
          description: 已改密
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: 校验失败（issues[].path=newPassword）
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/missions:
    get:
      tags: [missions]
      operationId: listMissions
      summary: 任务列表（最新 50 条）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [missions, total]
                properties:
                  missions:
                    type: array
                    items:
                      $ref: '#/components/schemas/MissionListItem'
                  total:
                    type: integer
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [missions]
      operationId: createMission
      summary: 创建任务（JSON 或 multipart：目标 + 附件一起提交）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMissionRequest'
          multipart/form-data:
            schema:
              type: object
              required: [objective]
              properties:
                targetMode:
                  type: string
                  enum: [attachment]
                  description: 纯附件项目；target 可省略，但必须至少上传一个 artifact
                target:
                  type: string
                  description: JSON 字符串，如 {"type":"url","value":"http://127.0.0.1:65280"}
                targetType: { type: string, enum: [url, domain, ip] }
                targetValue: { type: string }
                name: { type: string }
                objective: { type: string }
                maxSteps: { type: integer }
                maxWallClockMs: { type: integer }
                methodology: { type: string }
                scopeExtras:
                  type: string
                  description: JSON 字符串
                priority: { type: number }
                coverageGate:
                  type: string
                  description: JSON 字符串
                artifact:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: binary
                file:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: binary
                files:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedMission'
        '400':
          description: JSON 非法 / 校验失败 / 创建失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOrIssues'
  /api/missions/{id}:
    parameters:
      - $ref: '#/components/parameters/MissionId'
    get:
      tags: [missions]
      operationId: getMission
      summary: 任务详情（含任务、待办、触发器、提示、审批、Planner 运行）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [mission]
                properties:
                  mission:
                    $ref: '#/components/schemas/MissionDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/missions/{id}/summary:
    parameters:
      - $ref: '#/components/parameters/MissionId'
    get:
      tags: [missions]
      operationId: getMissionSummary
      summary: Summary 报告（任务终态后由 executor 生成；未生成时 summary=null）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: [object, 'null']
                    additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
  /api/missions/{id}/pause:
    parameters:
      - $ref: '#/components/parameters/MissionId'
    post:
      tags: [missions]
      operationId: pauseMission
      summary: 暂停任务并写 checkpoint
      responses:
        '200':
          description: 已暂停
          content:
            application/json:
              schema:
                type: object
                required: [mission]
                properties:
                  mission:
                    $ref: '#/components/schemas/MissionControlResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 当前状态不可暂停
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/missions/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/MissionId'
    post:
      tags: [missions]
      operationId: resumeMission
      summary: 恢复任务，从 checkpoint 续跑
      responses:
        '200':
          description: 已恢复（或恢复时直接终结）
          content:
            application/json:
              schema:
                type: object
                required: [mission]
                properties:
                  mission:
                    $ref: '#/components/schemas/MissionControlResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 不是 paused 状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/missions/{id}/stream:
    parameters:
      - $ref: '#/components/parameters/MissionId'
    get:
      tags: [missions]
      operationId: streamMission
      summary: SSE 实时快照（每 2 秒）
      responses:
        '200':
          description: |
            text/event-stream；每个 data 帧为以下 JSON 之一：
            - {"type":"mission","missionId":"...","state":"running","findings":2,"tasks":1,"openTasks":1,"triggers":0,"pendingApprovals":0,"updatedAt":"..."}
            - {"type":"error","error":"..."}
            - {"type":"gone","missionId":"..."}
          content:
            text/event-stream:
              schema:
                type: string
  /api/findings:
    get:
      tags: [findings]
      operationId: listFindings
      summary: 发现列表（最近 100 条）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [findings, total]
                properties:
                  findings:
                    type: array
                    items:
                      $ref: '#/components/schemas/FindingListItem'
                  total:
                    type: integer
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/findings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [findings]
      operationId: getFinding
      summary: 发现详情（报告 + 证据正文）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [finding]
                properties:
                  finding:
                    $ref: '#/components/schemas/FindingDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/findings/{id}/lineage:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [findings]
      operationId: getFindingLineage
      summary: 派生 finding 血缘（同 mission）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [lineage]
                properties:
                  lineage:
                    type: object
                    additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
  /api/missions/{id}/tasks:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [missions]
      operationId: createManualTask
      summary: 手动派发独立 intent（P1 1.7）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [objective]
              properties:
                objective: { type: string, minLength: 1, maxLength: 2000 }
                angle: { type: string, enum: [web, api, infra, binary] }
                priority: { type: number, minimum: 0, maximum: 1 }
                maxSteps: { type: integer, minimum: 0, maximum: 3000 }
                maxWallClockMs: { type: integer, minimum: 0, maximum: 7200000 }
                artifactIds:
                  type: array
                  maxItems: 20
                  items: { type: string, format: uuid }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [taskId, state]
                properties:
                  taskId: { type: string, format: uuid }
                  state: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/missions/{id}/tasks/{taskId}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: taskId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [missions]
      operationId: cancelTask
      summary: 取消单个任务（controller 软取消）
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId: { type: string, format: uuid }
                  missionId: { type: string, format: uuid }
                  state: { type: string }
  /api/missions/{id}/tasks/{taskId}/confirm-retry:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: taskId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [missions]
      operationId: confirmTaskRetry
      summary: 确认写动作后重试 blocked 任务
      responses:
        '200':
          description: 已放行
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId: { type: string, format: uuid }
                  missionId: { type: string, format: uuid }
                  state: { type: string }
                  actionCount: { type: integer }
  /api/missions/{id}/tasks/{taskId}/actions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: taskId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    get:
      tags: [missions]
      operationId: listTaskActions
      summary: 查询任务的写动作账本
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions: { type: array, items: { type: object } }
                  total: { type: integer }
  /api/missions/{id}/action-ledger:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
    get:
      tags: [missions]
      operationId: listMissionActionLedger
      summary: 查询 mission 的写动作账本
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions: { type: array, items: { type: object } }
                  total: { type: integer }
  /api/missions/{id}/steering:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
    get:
      tags: [missions]
      operationId: listSteering
      summary: 人工任务控制审计
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  commands: { type: array, items: { type: object } }
                  total: { type: integer }
  /api/approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: 审批列表（最近 100 条，pending 优先）
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [approvals, total]
                properties:
                  approvals:
                    type: array
                    items:
                      $ref: '#/components/schemas/Approval'
                  total:
                    type: integer
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [approvals]
      operationId: createApproval
      summary: 新建人工审批请求
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [missionId, type]
              properties:
                missionId:
                  type: string
                  format: uuid
                type:
                  type: string
                  minLength: 1
                  maxLength: 64
                payload:
                  type: object
                  additionalProperties: true
                  default: {}
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [approvalId]
                properties:
                  approvalId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/approvals/{id}/decide:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [approvals]
      operationId: decideApproval
      summary: 批准/拒绝审批
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, rejected]
                decidedBy:
                  type: string
                  minLength: 1
                  maxLength: 120
                note:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: 决策完成
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval:
                    $ref: '#/components/schemas/Approval'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 已决策 / 并发冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/hints:
    get:
      tags: [hints]
      operationId: listHints
      summary: 任务提示队列
      parameters:
        - name: missionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [hints, total]
                properties:
                  hints:
                    type: array
                    items:
                      $ref: '#/components/schemas/Hint'
                  total:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [hints]
      operationId: createHint
      summary: 追加控制面提示
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [missionId, content]
              properties:
                missionId:
                  type: string
                  format: uuid
                taskId:
                  type: string
                  format: uuid
                content:
                  type: string
                  minLength: 1
                  maxLength: 4000
                source:
                  type: string
                  minLength: 1
                  maxLength: 64
                kind:
                  type: string
                  enum: [guidance, help, report]
      responses:
        '201':
          description: 已入队
          content:
            application/json:
              schema:
                type: object
                required: [hintId]
                properties:
                  hintId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/triggers:
    get:
      tags: [triggers]
      operationId: listTriggers
      summary: 触发器路由审计
      parameters:
        - name: missionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [triggers, total]
                properties:
                  triggers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trigger'
                  total:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/traces:
    get:
      tags: [traces]
      operationId: listTrace
      summary: Worker / Planner 运行轨迹
      parameters:
        - name: subjectType
          in: query
          required: true
          schema:
            type: string
            enum: [worker, planner]
        - name: subjectId
          in: query
          required: true
          description: worker=taskId；planner=plannerRunId
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [trace, total]
                properties:
                  trace:
                    type: array
                    items:
                      $ref: '#/components/schemas/TraceRow'
                  total:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/missions/{id}/trace-summaries:
    parameters:
      - $ref: '#/components/parameters/MissionId'
    get:
      tags: [missions, traces]
      operationId: getMissionTraceSummaries
      summary: 同 mission 跨任务先验工作总结（P3-A1）
      parameters:
        - name: excludeTaskId
          in: query
          required: false
          description: 排除某个任务（Worker 注入路径排除当前任务）
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [summary]
                properties:
                  summary:
                    $ref: '#/components/schemas/MissionTraceSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/missions/{id}/facts:
    parameters:
      - $ref: '#/components/parameters/MissionId'
    get:
      tags: [missions]
      operationId: listMissionFacts
      summary: 黑板 typed facts（P3-B1 派生读模型；凭据明文）
      parameters:
        - name: kind
          in: query
          schema: { type: string }
          description: credential/vuln/host/artifact 等
        - name: trust
          in: query
          schema: { type: string, enum: [observed, inferred] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionFactsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/missions/{id}/frontier:
    parameters:
      - $ref: '#/components/parameters/MissionId'
    get:
      tags: [missions]
      operationId: getMissionFrontier
      summary: 黑板 frontier（开放意图 + 高信号事实）
      parameters:
        - name: factLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: intentLimit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [frontier]
                properties:
                  frontier:
                    $ref: '#/components/schemas/MissionFrontier'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
