          type: array
          items:
            type: string
        ips:
          type: array
          items:
            type: string
        urlPrefixes:
          type: array
          items:
            type: string
        reason:
          type: string
          maxLength: 1000
      description: url 或 domainSuffixes/ips/urlPrefixes 至少提供一个
    ScopeUpgradeApproval:
      type: object
      additionalProperties: true
      required: [approvalId, missionId, scopeExtras]
      properties:
        approvalId:
          type: string
          format: uuid
        missionId:
          type: string
          format: uuid
        matchedMissionId:
          type: string
          format: uuid
        scopeExtras:
          type: object
          additionalProperties: true
        coverageGate:
          type: object
          additionalProperties: false
          properties:
            enabled: { type: boolean }
            minRatio: { type: number, minimum: 0, maximum: 1 }
            requireAcceptedFinding: { type: boolean }
    MetricsSummary:
      type: object
      additionalProperties: true
      required: [generatedAt, missions, findings, rates, timing, tasks, evidence, cost, indicators]
      properties:
        generatedAt:
          type: string
          format: date-time
        missions:
          type: object
          additionalProperties: true
        findings:
          type: object
          additionalProperties: true
        rates:
          type: object
          additionalProperties: true
          description: 旧 v1 比率（分母为空时为 0）+ P3-A2 可空比率（falsePositiveRate/taskSuccessRate/taskRetryRate/handbackRate/evidenceDepth）。
        timing:
          type: object
          additionalProperties: true
        tasks:
          type: object
          additionalProperties: true
          description: total/running/stale/stuck + done/failed/exhausted/handedBack/attempted/retried。
        evidence:
          type: object
          additionalProperties: true
        cost:
          type: object
          additionalProperties: true
          description: totalTokens（Harness 累计 token 用量，成本代理非账单）与 tokensPerValidatedFinding（可为 null）。
        indicators:
          type: array
          description: 固定 12 项、顺序稳定；前端直接遍历渲染。
          items:
            $ref: '#/components/schemas/MetricValue'
    MetricValue:
      type: object
      additionalProperties: false
      required: [id, group, label, unit, definition, value, numerator, denominator]
      properties:
        id:
          type: string
          enum:
            - validated_findings
            - validation_rate
            - review_rate
            - false_positive_rate
            - duplicate_intent_rate
            - evidence_depth
            - time_to_first_fact_seconds
            - stuck_rate
            - task_success_rate
            - task_retry_rate
            - handback_rate
            - tokens_per_validated_finding
        group:
          type: string
          enum: [quality, efficiency, safety, control]
        label:
          type: string
          description: 中文短名
        unit:
          type: string
          enum: [count, ratio, seconds, tokens]
        definition:
          type: string
          description: 口径说明
        value:
          type: [number, 'null']
          description: null 表示 N/A（分母为空）；UI 必须显示 N/A 而不是 0。
        numerator:
          type: [number, 'null']
        denominator:
          type: [number, 'null']
    TraceSummaryTokenUsage:
      type: object
      additionalProperties: false
      required: [input, output, total]
      properties:
        input:
          type: integer
        output:
          type: integer
        total:
          type: integer
          description: Harness 累计 token 用量（缺失时按 input+output 计）。
    TraceSummaryTask:
      type: object
      additionalProperties: false
      required:
        - taskId
        - type
        - state
        - attempt
        - steps
        - tokens
        - findings
        - acceptedFindings
        - evidence
        - toolCalls
        - traceEvents
        - toolCounts
        - skillsLoaded
        - startedAt
        - completedAt
        - firstTraceAt
        - lastTraceAt
        - finalText
        - lastError
      properties:
        taskId:
          type: string
          format: uuid
        type:
          type: string
        state:
          type: string
        attempt:
          type: integer
        steps:
          type: integer
        tokens:
          $ref: '#/components/schemas/TraceSummaryTokenUsage'
        findings:
          type: integer
        acceptedFindings:
          type: integer
        evidence:
          type: integer
        toolCalls:
          type: integer
        traceEvents:
          type: integer
        toolCounts:
          type: object
          additionalProperties:
            type: integer
        skillsLoaded:
          type: array
          items:
            type: string
        startedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        firstTraceAt:
          type: [string, 'null']
          format: date-time
        lastTraceAt:
          type: [string, 'null']
          format: date-time
        finalText:
          type: [string, 'null']
          description: 截断后的 worker 总结（≤200 字符），可能引用目标内容，展示为不可信数据。
        lastError:
          type: [string, 'null']
          description: 截断后的失败原因（≤160 字符）。
    MissionTraceSummary:
      type: object
      additionalProperties: false
      required: [missionId, missionName, generatedAt, totals, tasks, digest]
      properties:
        missionId:
          type: string
          format: uuid
        missionName:
          type: string
        generatedAt:
          type: string
          format: date-time
        totals:
          type: object
          additionalProperties: true
          description: 聚合统计（tasks/done/failed/running/steps/tokens/findings/acceptedFindings/evidence/toolCalls/toolCounts/skillsLoaded）。
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TraceSummaryTask'
        digest:
          type: string
          description: Worker 实际注入的有界摘要（默认 ≤1500 字符）；空字符串=没有可注入的先验工作。

    MissionFact:
      type: object
      additionalProperties: false
      required:
