        missionId: { type: string, format: uuid }
        version: { type: integer }
        generatedAt: { type: string, format: date-time }
        threshold: { type: integer }
        folded: { type: boolean }
        original:
          type: object
          additionalProperties: false
          required: [nodes, edges]
          properties:
            nodes: { type: integer }
            edges: { type: integer }
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ExploreGraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/ExploreGraphEdge'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ExploreGraphGroup'

    MissionArtifact:
      type: object
      additionalProperties: false
      required: [id, missionId, taskId, sha256, size, filename, contentType, createdAt]
      properties:
        id: { type: string, format: uuid }
        missionId: { type: string, format: uuid }
        taskId: { type: [string, 'null'], format: uuid }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer, minimum: 0 }
        filename: { type: string }
        contentType: { type: string }
        createdAt: { type: string, format: date-time }

    ModelConfigTestRequest:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: 已保存的配置 id；省略 apiKey 时复用它保存的 key
        baseUrl: { type: string }
        apiKey: { type: string }
        modelName: { type: string }
        maxOutputTokens: { type: integer, minimum: 1 }
    ModelConfigTestResult:
      type: object
      additionalProperties: false
      required: [ok, latencyMs, httpStatus, model, reply, usage, error, errorCode, traceId]
      properties:
        ok: { type: boolean }
        latencyMs: { type: integer }
        httpStatus: { type: [integer, 'null'] }
        model: { type: [string, 'null'] }
        reply: { type: [string, 'null'] }
        usage: { type: [object, 'null'], additionalProperties: true }
        error: { type: [string, 'null'] }
        errorCode: { type: [string, 'null'] }
        traceId: { type: [string, 'null'] }
    EvalRun:
      type: object
      additionalProperties: true
      required: [id, kind, name, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [matrix, fixture, effect, frozen, replay, other] }
        name: { type: string }
        status: { type: string, enum: [completed, failed, partial] }
        summary: { type: object, additionalProperties: true }
        details: { type: [object, 'null'], additionalProperties: true }
        recordedBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
