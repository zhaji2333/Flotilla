components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API_AUTH_TOKEN；/api/health 不需要鉴权，SSE 也接受 ?token=。
  parameters:
    MissionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 参数/JSON 校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorOrIssues'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 缺少或无效的 Bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: token 有效但缺少 admin 权限（模型配置路由）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 数据库/服务不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ErrorOrIssues:
      type: object
      required: [error]
      properties:
        error:
          type: string
        issues:
          type: array
          items:
            type: object
            additionalProperties: true
    Health:
      type: object
      required: [ok, service, egressMode]
      properties:
        ok:
          type: boolean
        service:
          type: string
        egressMode:
          type: string
          enum: [scope, open]
        error:
          type: string
    MissionTarget:
      type: object
      additionalProperties: false
